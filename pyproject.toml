[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nl2repobench"
version = "0.1.0"
description = "Authoring, validation, and experiment metadata core for NL2RepoBench."
readme = "readme.md"
requires-python = ">=3.11"
authors = [{ name = "NL2RepoBench contributors" }]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "polars>=1.20,<2",
  "pydantic>=2.7,<3",
  "tomli-w>=1.2,<2",
  "typer>=0.15,<1",
]

[project.scripts]
nl2repo = "nl2repobench.cli:app"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "oss2>=2.18,<3",
  "types-defusedxml>=0.7.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nl2repobench"]

[tool.pytest.ini_options]
addopts = "-ra --cov=nl2repobench --cov-report=term-missing:skip-covered --cov-fail-under=80"
testpaths = ["tests"]
norecursedirs = ["legacy"]

[tool.coverage.run]
omit = [
  "src/nl2repobench/harbor_docker.py",
  "src/nl2repobench/harbor_openhands.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "docker_self",
  "examples/harbor",
  "logging_config.py",
  "main.py",
  "only_test.py",
  "openhands",
  "test_data_service.py",
  "tests/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/nl2repobench"]
