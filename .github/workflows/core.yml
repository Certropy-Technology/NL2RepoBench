name: metadata-core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Synchronize locked environment
        run: |
          uv lock --check
          uv lock --project harbor-runner --check
          uv lock --project legacy --check
          uv lock --project verifier --check
          uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Check generated JSON Schema
        run: |
          uv run nl2repo schema export --output /tmp/nl2repo-schemas
          diff -ru schemas/v1 /tmp/nl2repo-schemas

      - name: Check verifier dependency export
        run: |
          uv export \
            --project verifier \
            --format requirements.txt \
            --no-header \
            --no-annotate \
            --output-file /tmp/verifier-requirements.lock.txt
          diff -u verifier/requirements.lock.txt /tmp/verifier-requirements.lock.txt

      - name: Compile declarative catalog
        run: |
          uv run nl2repo dataset compile \
            catalog/datasets/nl2repobench-examples/dataset.toml \
            --output /tmp/nl2repo-catalog \
            --artifact-root /tmp/nl2repo-artifacts \
            --state-db /tmp/nl2repo-state.db
          uv run nl2repo dataset validate /tmp/nl2repo-catalog

      - name: Compile Harbor development fixture
        run: |
          uv run --frozen --project harbor-runner harbor --version
          uv run nl2repo harbor compile \
            catalog/tasks/ministats \
            --output /tmp/nl2repo-harbor \
            --toolchain toolchain.lock.toml \
            --allow-incomplete
          bash -n \
            /tmp/nl2repo-harbor/ministats/tests/test.sh \
            /tmp/nl2repo-harbor/ministats/solution/solve.sh

      - name: Check legacy metadata baseline
        run: |
          uv run nl2repo task import-legacy \
            --legacy-root test_files \
            --output /tmp/nl2repo-legacy \
            --artifact-root /tmp/nl2repo-legacy-artifacts \
            --state-db /tmp/nl2repo-legacy-state.db \
            --difficulty-file test_files/task_difficulty.csv \
            --report /tmp/legacy-metadata-gap.v1.json
          diff -u \
            reports/legacy-metadata-gap.v1.json \
            /tmp/legacy-metadata-gap.v1.json
