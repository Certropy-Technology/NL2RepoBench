name: phase2-controls

on:
  pull_request:
    paths:
      - "catalog/tasks/ministats/**"
      - "harbor-runner/**"
      - "scripts/run_phase2_ministats_controls.sh"
      - "scripts/summarize_phase2_controls.py"
      - "src/nl2repobench/harbor/**"
      - "src/nl2repobench/verification/**"
      - "reports/phase2-ministats-controls.v1.json"
      - "toolchain.lock.toml"
      - "verifier/**"
      - ".github/workflows/phase2-controls.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  ministats-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Synchronize environment
        run: |
          uv sync --frozen
          uv sync --frozen --project harbor-runner

      - name: Run Harbor control matrix
        env:
          PHASE2_CONTROL_REFERENCE: reports/phase2-ministats-controls.v1.json
        run: scripts/run_phase2_ministats_controls.sh .nl2repo/phase2-controls

      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: phase2-controls-${{ github.sha }}
          path: |
            .nl2repo/phase2-controls/control-summary.json
            .nl2repo/phase2-controls/jobs/**/result.json
            .nl2repo/phase2-controls/jobs/**/lock.json
            .nl2repo/phase2-controls/jobs/**/verifier/*.json
            .nl2repo/phase2-controls/jobs/**/*.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          if [[ -f .nl2repo/phase2-controls/control-summary.json ]]; then
            {
              echo '```json'
              cat .nl2repo/phase2-controls/control-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
