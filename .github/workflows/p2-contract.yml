name: P2 contract and adapters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/nl2repobench
      - run: uv run pytest -q
      - run: uv run python scripts/verify_p2_contract.py
      - run: uv run pytest -q -p no:cacheprovider --no-cov tests/test_no_vendor_install.py
      - name: Check network policy
        run: |
          uv run nl2repo task lint-network --include-generated > network-lint.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("network-lint.json").read_text())
          if result["error_count"]:
              raise SystemExit(f"network lint errors: {result['error_count']}")
          PY
