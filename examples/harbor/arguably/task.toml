schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/arguably"
version = "1.0.0"
description = "Build the arguably CLI argument parsing library from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "cli", "argument-parsing", "repository-generation", "pytest"]

[metadata]
difficulty = "medium"
category = "cli-library"
tags = ["python", "cli", "argparse", "typing"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 70

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192

[verifier.environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
