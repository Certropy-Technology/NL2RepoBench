schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/ministats"
version = "1.0.0"
description = "Build a small Unicode-aware text statistics package from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "repository-generation", "nl2repobench", "pytest", "separate-verifier"]

[metadata]
difficulty = "easy"
category = "utility-library"
tags = ["python", "packaging", "unicode", "cli"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 18

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
