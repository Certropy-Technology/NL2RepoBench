reason = "Generic private-bundle compiled Oracle passed 36/36 with reward 1.0 on the re-based python:3.12.14-slim-bookworm verifier base; the 36-item frozen collection was re-confirmed on that base. Stub 0.194, forgery 0.194 (byte-identical to stub, so tampering had no effect) and empty 0.0 controls pass. Blind/traceability review and pilot remain pending. Canonical dependency closure, exact runtime identity, and current verifier evidence remain unavailable."

