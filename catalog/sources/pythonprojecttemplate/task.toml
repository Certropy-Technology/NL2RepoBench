[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Third-party build and test dependencies are installed during the Docker build phase, which has network. The agent phase therefore needs no egress, and the Oracle bundle ships the frozen source archive locally so even an Oracle run needs no host authorization. A model provider host, when an in-container agent needs one, is injected per run via Harbor agent.extra_allowed_hosts instead of being pinned in task metadata."

