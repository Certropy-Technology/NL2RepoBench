schema_version = "1.0"
task_id = "go-synthetic"
version = "0.1.0"
instruction = "instruction.md"

[metadata]
difficulty = "easy"
category = "go-library"
tags = ["go", "go-modules", "typed-bridge"]
language = "go"

[source]
status = "unknown"

[environment]
status = "unknown"
os_name = "debian-bookworm"
network_mode = "no-network"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Synthetic pure-Go fixture has no external runtime service."

[dependencies]
status = "unknown"
package_manager = "go-modules"
packages = []

[tests]
framework = "pytest"
expected_total = 1
expected_total_source = "frozen-collection"
commands = ["go test ./..."]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = []
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
description = "Build a pure-Go module through a typed public API bridge."
keywords = ["go", "go-modules", "typed-bridge", "repository-generation"]
agent_timeout_sec = 600.0
verifier_timeout_sec = 600.0
candidate_install_timeout_sec = 90.0
candidate_total_timeout_sec = 300.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 1
memory_mb = 1024
storage_mb = 4096
workspace_artifact = "/workspace"

[lifecycle]
status = "discovered"
reason = "Synthetic adapter fixture; real source freeze and production Go image are pending."
