task_id = "coverage_shield"
version = "0.1.0"
instruction = "instruction.md"
schema_version = "1.0"

[metadata]
difficulty = "easy"
category = "developer-tool"
tags = [
    "python",
    "coverage",
    "cli",
    "git",
]
language = "python"

[source]
status = "known"
upstream_url = "https://github.com/JosephCrispell/coverage_shield"
revision = "fd8b4511f6ec1c8a2730b9c82188d16d0d968cd3"
license_spdx = "GPL-3.0"
source_digest = "sha256:e8cf4d502c1d2b0a0443ecdec1f57d55df5a49fff32052e4dfde0ba0acc3c3f0"

[harbor]
description = "Build the coverage_shield Python coverage-badge tool from an empty workspace."
keywords = [
    "python",
    "coverage",
    "repository-generation",
    "cli",
    "separate-verifier",
]
agent_timeout_sec = 1800.0
verifier_timeout_sec = 600.0
candidate_install_timeout_sec = 60.0
candidate_total_timeout_sec = 300.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workspace_artifact = "/workspace"

[environment]
status = "unknown"
os_name = "linux/amd64"
base_image = "ghcr.io/multimodal-art-projection/nl2repobench/coverage_shield"
base_image_digest = "sha256:78b52f4c9cbf18b368a958cb3b933727c0a30b064b1fa33492e887129565f4c9"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Third-party build and test dependencies are installed during the Docker build phase, which has network. The agent phase therefore needs no egress. A model provider host, when an in-container agent needs one, is injected per run via Harbor agent.extra_allowed_hosts instead of being pinned in task metadata."

[dependencies]
status = "unknown"
package_manager = "pip"
packages = [
    "coverage",
    "pandas",
    "seaborn",
    "pytest",
    "setuptools",
]

[tests]
framework = "pytest"
report_format = "pytest-junit-xml-v1"
expected_total = 11
expected_total_source = "unknown"

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = [
    "passed",
]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
reason = "Static migration only: the pinned verifier image corroborates 11 cached pytest node IDs, but no fresh collection or Oracle/control run was executed; its legacy direct-import verifier also lacks the Phase 2 candidate subprocess boundary. Canonical dependency closure and exact Python package-manager runtime identity are unavailable; create lock/offline-store/inventory artifacts and a versioned release before production use."
