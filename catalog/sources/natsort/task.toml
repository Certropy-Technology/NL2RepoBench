[dependencies]
# Runtime scope is the standard-library fallback. These are provisional
# authoring/test tools only; no hash-locked requirements artifact or lock digest is claimed.
status = "unknown"
installer = "uv"
packages = ["pytest", "hypothesis", "setuptools"]

[tests]
framework = "pytest"
# The v1 source schema requires a positive integer. This is an explicitly
# non-scoring sentinel until bounded pytest and Hypothesis collection is
# repeated in the final environment.
expected_total = 1
expected_total_source = "unknown"
commands = [
  "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 LC_ALL=C.UTF-8 LANG=C.UTF-8 python -m pytest --collect-only -q -p no:cacheprovider -o addopts='' tests",
  "PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 LC_ALL=C.UTF-8 LANG=C.UTF-8 python -m pytest --collect-only -q -p no:cacheprovider -o addopts='' tests",
]
protected_paths = ["tests"]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = []
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
reason = "Audit candidate only. Exact archive digest and LICENSE evidence, source-only LOC, stable pytest/Hypothesis collection, offline dependency closure, locale/Unicode repeatability, and JSON-safe scope evidence are missing. expected_total=1 is a schema sentinel and must not be used as a denominator. No Harbor, Oracle, or private test artifact is present."
