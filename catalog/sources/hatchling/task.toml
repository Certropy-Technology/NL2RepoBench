system_packages = []
build_command = "Install the hash-locked packaging/runtime and setuptools build closure during Docker build; candidate installation uses pip --target --no-deps --no-build-isolation."

[environment.runtime]
language = "python"
runtime = "cpython"
version = "3.12.14"
package_manager = "pip"
package_manager_version = "26.0.1"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "The Python packaging/runtime and candidate build tools are installed from a hash-locked package-index closure during Docker build. Agent and separate verifier runtime phases need no registry or source egress. The trusted Oracle alone receives a run-scoped github.com authorization, fetches the exact declared commit, and verifies the frozen backend subtree archive digest."

[dependencies]
status = "unknown"
package_manager = "pip"
packages = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "setuptools==80.10.2",
    "tomlkit==0.13.3",
    "trove-classifiers==2026.6.1.19",
    "wheel==0.45.1",
]

[tests]
framework = "custom"
report_format = "custom-json-v1"
expected_total = 21
expected_total_source = "frozen-collection"

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = [
    "passed",
]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
description = "Build Hatchling 1.32.0 from an empty workspace and satisfy a bounded PEP 517 metadata, wheel, sdist, version, plugin, normalization, and reproducibility contract through a separate subprocess verifier."
keywords = [
    "python",
    "packaging",
    "pep517",
    "wheel",
    "sdist",
    "separate-verifier",
]
agent_timeout_sec = 3600.0
verifier_timeout_sec = 900.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 480.0
agent_network_mode = "no-network"
agent_allowed_hosts = []
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workspace_artifact = "/workspace"

[lifecycle]
status = "blocked"
owner = "worker/hatchling"
reason = "Canonical dependency lock/offline-store/inventory closure is unavailable; legacy single lock_artifact was not retyped. Previous status/reason: controls-passed: The frozen Hatchling backend subtree, 21-leaf separate verifier, hash-locked build closure, and Oracle fetch contract compile as a production bundle. Harbor 0.21.0 recorded Oracle 21/21 with reward 1.0; empty, stub, forgery, call-timeout, install-timeout, and offline controls produced valid verifier-owned outcomes. Model pilot, review, dataset integration, and publication remain outside this lane."

[verifier]
protocol = "custom-json-v1"
entrypoint = "run.py"

