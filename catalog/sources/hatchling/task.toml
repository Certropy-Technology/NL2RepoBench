owner = "worker/hatchling"
reason = "The frozen Hatchling backend subtree, 21-leaf separate verifier, hash-locked build closure, and Oracle fetch contract compile as a production bundle. Harbor 0.21.0 recorded Oracle 21/21 with reward 1.0; empty, stub, forgery, call-timeout, install-timeout, and offline controls produced valid verifier-owned outcomes. Model pilot, review, dataset integration, and publication remain outside this lane."
