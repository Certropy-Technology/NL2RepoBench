[harbor]
description = "Reimplement a tested subset of RubyZip's in-memory archive API: Zip::OutputStream.write_buffer authoring with STORED and DEFLATE entries, Zip::File.open_buffer enumeration, read, get_input_stream streaming, entry metadata (name, size, crc, compression_method), directory entries, and the find_entry/get_entry absence contract."
keywords = ["ruby", "bundler", "rubyzip", "zip", "archive", "json-bridge", "repository-generation"]
agent_timeout_sec = 900.0
verifier_timeout_sec = 900.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 420.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 1
memory_mb = 2048
storage_mb = 8192
workspace_artifact = "/workspace"

[lifecycle]
status = "packaged"
owner = "rubyzip-wave1-recovery"
reason = "Frozen BSD-2-Clause rubyzip v3.2.2 revision whose git-archive source digest reproduced exactly at recovery time; pure-Ruby zero-dependency closure on the shared private Bundler cache. The public bridge was repaired (it previously yielded a String instead of the OutputStream and relied on return values upstream does not propagate) and all 8 frozen contract leaves pass against the pinned upstream implementation inside the digest-pinned Ruby 3.4.10 image with network disabled. Official Harbor Oracle/control runs remain with the parent integrator; no Oracle or controls result is claimed here."

