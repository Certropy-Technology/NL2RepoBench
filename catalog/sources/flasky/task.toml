schema_version = "1.0"
task_id = "flasky"
version = "0.1.0"
instruction = "instruction.md"

[metadata]
difficulty = "medium"
category = "web-application"
tags = ["python", "flask", "sqlalchemy", "rest-api", "web-application", "repository-generation"]
language = "python"

# The source and license are locked in provenance.md. The verifier image is
# the immutable image assigned by the conversion loop.
[source]
status = "known"
upstream_url = "https://github.com/miguelgrinberg/flasky"
revision = "3beedd640b9146b0bd65c8c2ecf402b01798bc33"
license_spdx = "MIT"
source_digest = "sha256:d70278ce85aadc6127ef9f997c0410076488b744c01631a45499dc03bcd698d6"
submodules = []

[environment]
status = "known"
python_version = "3.9.23"
os_name = "debian-13"
base_image = "ghcr.io/multimodal-art-projection/nl2repobench/flasky"
base_image_digest = "sha256:dd7c1ab35038eb22f5637d7fb8d210d2a6bf080d65ca72c89b4ac31af3e0c342"
network_mode = "no-network"

# The immutable verifier image contains the benchmark dependency closure.
# A standalone hash-locked wheelhouse has not been authored in this static pass.

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Third-party build and test dependencies are installed during the Docker build phase, which has network. The agent phase therefore needs no egress. A model provider host, when an in-container agent needs one, is injected per run via Harbor agent.extra_allowed_hosts instead of being pinned in task metadata."
