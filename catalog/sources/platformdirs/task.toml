[lifecycle]
status = "blocked"
owner = "python-recover-parent-platformdirs"
reason = "BLOCKED: platformdirs 4.11.3 real __init__.py does from .version import __version__; hatchling (in a no-git/offline build env) excludes version.py from the wheel (treats it as a vcs-hook artifact), so import platformdirs always fails on the installed candidate. This is a build-tool/source mechanism issue, not a candidate capability gap: NoNetwork + no-git env cannot reliably produce an installable platformdirs. Oracle gate1-5 all 0/64 for this reason. Could not be made runnable honestly without weakening the verifier."
