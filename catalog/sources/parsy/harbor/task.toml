# Development descriptor only. This is intentionally not a runnable Harbor
# bundle: private tests, command plan, hash-locked dependency lock, Oracle, and a
# task-specific subprocess scenario adapter are omitted until authorized private
# artifacts are provisioned in task.toml. The expected test count below is a
# source-only observation, not a frozen production denominator.
schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/parsy"
version = "0.1.0"
description = "Build the parsy parser-combinator library from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "parser-combinators", "pytest", "separate-verifier", "no-network"]

[metadata]
difficulty = "easy"
category = "parser-combinators"
tags = ["python", "parser-combinators"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 88

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
