[source]
status = "unknown"
upstream_url = "https://github.com/psf/pyperf"
# PyPI sdist is the frozen authority for this authoring wave. It does not
# preserve the upstream Git commit; use the content-addressed sdist identity
# until a Git revision is separately reconciled by the integrator.
revision = "dd93ccfda79214725293e95f1fa6e00cb4a64adcf1326039486d4e1f91caaa62"
license_spdx = "MIT"
