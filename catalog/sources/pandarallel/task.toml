[harbor]
description = "Build the pandarallel pandas parallelization package from an empty workspace."
keywords = [
    "python",
    "pandas",
    "dataframe",
    "multiprocessing",
    "parallel-computing",
    "separate-verifier",
]
agent_timeout_sec = 3600.0
verifier_timeout_sec = 900.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 600.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workspace_artifact = "/workspace"

[lifecycle]
status = "blocked"
reason = "Production compilation is blocked: the packaged direct-import pytest verifier does not satisfy the candidate subprocess boundary, and the replacement 217-case custom adapter plus Python 3.12 hash lock have not completed runtime validation. No official Oracle or controls were run."
[environment]
status = "unknown"
os_name = "debian-trixie"
base_image = "ghcr.io/multimodal-art-projection/nl2repobench/pandarallel"
base_image_digest = "sha256:f25336a4bdcab50fb33ef2cb008c10634915e98e7dcbe167750a5190fc46ed38"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Third-party build and test dependencies are installed during the Docker build phase, which has network. The agent phase therefore needs no egress. A model provider host, when an in-container agent needs one, is injected per run via Harbor agent.extra_allowed_hosts instead of being pinned in task metadata."

[dependencies]
status = "unknown"
packages = [
    "dill==0.4.0",
