    "trove-classifiers==2026.6.1.19",
    "vcs-versioning==2.3.1",
]
package_manager = "pip"

[tests]
framework = "custom"
expected_total = 20
expected_total_source = "frozen-collection"
report_format = "custom-json-v1"

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = [
    "passed",
]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
description = "Build the pinned attrs class-building library from an empty workspace; grading uses deterministic allowlisted JSON class, conversion, validation, and introspection scenarios."
keywords = [
    "python",
    "data-model",
    "validators",
    "converters",
    "json-scenarios",
    "separate-verifier",
]
agent_timeout_sec = 3600.0
verifier_timeout_sec = 600.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 300.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workspace_artifact = "/workspace"

[verifier]
protocol = "custom-json-v1"
entrypoint = "run.py"

[verifier.bundle]
digest = "sha256:193fc637b9876ef82979e422b12dc77a761387a303831c886c122e1fc6d0e0cb"
