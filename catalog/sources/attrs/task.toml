schema_version = "1.0"
task_id = "attrs"
version = "0.1.0"
instruction = "instruction.md"

[metadata]
difficulty = "hard"
category = "data-model"
tags = ["python", "data-model", "dataclass-transform", "validators", "converters", "repository-generation", "pytest", "separate-verifier"]
language = "python"

[source]
status = "known"
upstream_url = "https://github.com/python-attrs/attrs"
revision = "c1dc5dcba16ed827aa6dcad896b41a3afedb4e32"
license_spdx = "MIT"
# Unprefixed `git archive --format=tar HEAD` from the detached revision.
source_digest = "sha256:c7ebd671099d268790f83a2bc3e51b0dc3844bafd41a71b9768567e656538fac"
submodules = []

[environment]
# The source and collection probes are recorded in audit.md, but no final
# verifier image, OS lock, or platform policy has been approved.
status = "unknown"
python_version = ">=3.10"
os_name = "unknown"
network_mode = "no-network"

[dependencies]
# attrs has no runtime dependencies. These are the unpinned build, default
# test, optional-test, and type-checking requirements observed in the source;
# they are not a production dependency closure.
status = "unknown"
installer = "uv"
packages = [
  "hatchling",
  "hatch-vcs",
  "hatch-fancy-pypi-readme>=23.2.0",
  "pytest>9",
  "hypothesis",
  "pytest-xdist[psutil]",
  "cloudpickle; platform_python_implementation == 'CPython'",
  "pympler",
  "pytest-mypy-plugins; platform_python_implementation == 'CPython' and python_version >= '3.10'",
  "mypy",
  "pyright",
]

[tests]
framework = "pytest"
# CPython 3.12/pytest 8.4.1 collected 1411 nodes. CPython 3.14/pytest
# 9.1.1 collected 1412 because test_forward_references.py is enabled there.
# This is a static probe, not a frozen production denominator.
expected_total = 1411
expected_total_source = "unknown"
commands = ["python -m pytest --continue-on-collection-errors -q"]
protected_paths = ["tests"]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = []
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
reason = "The exact source revision, archive and MIT license evidence, package/API inventory, dependency review, deterministic-behavior review, and clean collect-only probes are recorded. Publication is blocked because the final environment and hash-locked offline dependency bundle, private test and command artifacts, Oracle bundle, and attrs-specific child-side JSON scenario adapter are absent; no hidden tests, private bytes, Docker, Oracle, or shared catalog edits are authorized in this static lane."
