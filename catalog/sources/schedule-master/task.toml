# Runtime and test dependencies ship as a private offline wheelhouse artifact
# (pytest 8.4.1 and pytz 2025.2) installed during the Docker build phase.
# The frozen suite selects explicit POSIX TZ strings and calls time.tzset(), so
# host tzdata does not participate in grading; remote timezone behaviour comes
# from the pinned pytz wheel.

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "Third-party build and test dependencies are installed during the Docker build phase, which has network. The agent phase therefore needs no egress. A model provider host, when an in-container agent needs one, is injected per run via Harbor agent.extra_allowed_hosts instead of being pinned in task metadata."
[dependencies]
status = "known"
installer = "pip"
packages = ["pytest==8.4.1", "pytz==2025.2", "setuptools==75.8.0", "wheel==0.45.1"]
artifact = { digest = "sha256:7189900847f846f228fa95b397d2e358a1a66da7000cceb55e8e5fb2e880f95b", size_bytes = 3512320, media_type = "application/vnd.nl2repobench.private-bundle+tar", uri = "artifact://private/sha256:7189900847f846f228fa95b397d2e358a1a66da7000cceb55e8e5fb2e880f95b", visibility = "private" }

[tests]
