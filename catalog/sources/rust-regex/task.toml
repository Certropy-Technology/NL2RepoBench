reason = "Source freeze is healthy (regex 1.13.1 revision 7c28ee4dc4aef53571c96757f4825c51ac0c3d44; archive and MIT/Apache license digests captured in evidence/). But regex cannot be authored as a from-scratch rebuild in the Rust/Cargo production lane: the reference requires the non-optional regex-automata and regex-syntax crates just to compile (cargo check --offline fails with 'no matching package named regex-automata', evidence/remediation.log STEP 3), and regex-syntax additionally ships committed machine-generated Unicode Character Database tables. Because this lane materialises ONE shared offline Cargo closure (environment/cargo-bundle copied verbatim into the verifier image and reused to resolve a candidate's dependencies), supplying those crates for the Oracle build also hands the candidate the entire matching engine and parser, reducing the task to a `pub use` facade over upstream regex and shipping generated reference data. Unlike aho-corasick (whose only mandatory dep is the leaf primitive memchr) or smallvec (std-only), the substitution cannot be narrowed away: removing the unicode feature does not remove the mandatory engine crates. Unblocking requires a parent-owned runtime capability (reference-only engine closure absent from the candidate plus a candidate-safe way to provide generated Unicode tables), which is out of this writer's scope. No Harbor runtime, Oracle, controls, reward, or production validity is claimed."
