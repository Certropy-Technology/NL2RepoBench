[environment]
# The source probe was Linux-only. No final image or OS lock is authorized.
status = "unknown"
python_version = ">=3.10"
os_name = "unknown"
network_mode = "no-network"

[dependencies]
# These are source-declared roots and probe tools, not a distributable closure.
status = "unknown"
installer = "uv"
packages = [
  "setuptools>=68",
  "wcwidth>=0.1.4",
  "pytest>=8.1.1",
  "pytest-cov>=5",
  "coverage>=7.11",
  "pytest-mock>=3.14.1",
]

[tests]
framework = "pytest"
# Linux CPython 3.10/3.13/3.14 probes each collected 156 nodes. This is not
# a final verifier denominator; Windows skips five marked output tests.
expected_total = 156
expected_total_source = "unknown"
commands = [
  "python -m pip install -e .",
  "python -m pytest --continue-on-collection-errors -q tests",
]
protected_paths = ["tests"]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = ["skipped"]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
# Development execution profile only; no Harbor bundle is included here.
description = "Build the prompt-toolkit interactive terminal UI library from an empty workspace."
keywords = [
  "python",
  "terminal",
  "interactive-cli",
  "line-editing",
  "completion",
  "widgets",
  "pytest",
  "separate-verifier",
]
agent_timeout_sec = 3600.0
verifier_timeout_sec = 900.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 600.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workspace_artifact = "/workspace"

[lifecycle]
status = "blocked"
reason = "Static source and collection evidence is recorded, but final environment, offline dependency closure, terminal/TTY policy, candidate subprocess adapter, private verifier assets, frozen denominator, Oracle, and controls are not yet proven."
