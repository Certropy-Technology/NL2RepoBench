    "flit_core==3.12.0",
]

[tests]
framework = "custom"
report_format = "custom-json-v1"
expected_total = 24
expected_total_source = "frozen-collection"

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = [
    "passed",
]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
description = "Build editables 0.6 from an empty workspace and reproduce deterministic editable-install file generation and import-hook behavior through a separate child-side JSON verifier."
keywords = [
    "python",
    "packaging",
    "editable-install",
    "import-hooks",
    "pth-files",
    "separate-verifier",
]
agent_timeout_sec = 1800.0
verifier_timeout_sec = 480.0
candidate_install_timeout_sec = 120.0
candidate_total_timeout_sec = 240.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 2
memory_mb = 3072
storage_mb = 6144
workspace_artifact = "/workspace"

[verifier]
protocol = "custom-json-v1"
entrypoint = "run.py"

