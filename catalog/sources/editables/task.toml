system_packages = []
build_command = "python -m pip install --no-cache-dir --require-hashes -r candidate-requirements.lock.txt"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
