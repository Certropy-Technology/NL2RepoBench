expected_total_source = "frozen-collection"

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = [
    "passed",
]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
owner = "python-author-wave2-20260828"
reason = "Production bundle passed the required Oracle, empty, stub, forgery, install-timeout, and offline verifier controls; independent review, pilot, and publication remain separate stages. Canonical dependency closure and exact Python package-manager runtime identity are unavailable; create lock/offline-store/inventory artifacts and a versioned release before production use."
