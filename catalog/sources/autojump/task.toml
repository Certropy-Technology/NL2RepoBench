schema_version = "1.0"
task_id = "autojump"
version = "0.2.0"
instruction = "instruction.md"

[metadata]
difficulty = "medium"
category = "python-cli"
tags = [
    "python",
    "cli",
    "shell",
    "filesystem",
    "repository-generation",
    "separate-verifier",
]
language = "python"

[source]
status = "known"
upstream_url = "https://github.com/wting/autojump"
revision = "ee21082751da739c65fe0ec2d02ca95d4266aebc"
