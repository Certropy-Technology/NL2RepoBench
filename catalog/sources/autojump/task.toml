reason = "Official Harbor 0.21 receipts are hash-bound in production-evidence.json: Oracle passed 23/23 with reward 1.0; empty scored 0/23 with an honest model-class installation failure; stub and forgery each scored 1/23; and verifier network probes confirmed offline execution. Blind and traceability review remain pending."
