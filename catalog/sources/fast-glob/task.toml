# Canonical schema v2 has no [environment.network_policy] block; the offline
# contract is expressed by network_mode plus the dependency bundle below. The
# npm v3 lock and its 71-file cache closure are generated during the authoring
# build phase and shipped as an offline bundle, so `npm ci --offline` needs no
# egress, and the Oracle ships a precompiled distribution that fetches no
# source at run time.

[dependencies]
# `unknown` until the offline npm bundle is registered as a content-addressed
# private artifact. The closure itself exists and is verified (see handoff.md);
# only the artifact binding is outstanding, so production compile is not yet
# claimed and the bundle is supplied via --allow-incomplete.
