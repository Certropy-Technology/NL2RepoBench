[task]
name = "nl2repobench/google-api-core"
version = "1.0.0"
description = "Build google-api-core 2.35.0 from an empty workspace and reproduce deterministic helpers, retry and timeout behavior, path and REST serialization, protobuf utilities, client metadata, exceptions, and universe-domain contracts through a separate child-side JSON verifier."
