[task]
name = "nl2repobench/importlib-metadata"
version = "0.1.0"
description = "Build importlib-metadata from an empty workspace and reproduce deterministic directory, egg-info, zip, metadata, file-record, requirement, and entry-point behavior through a separate child-side JSON verifier."
