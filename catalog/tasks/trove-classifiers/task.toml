schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/trove-classifiers"
version = "1.0.0"
description = "Build the frozen trove-classifiers package from an empty workspace and reproduce its typed classifier containers, deprecation mapping, packaging metadata, and equivalent module/console CLI through a separate offline verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "trove-classifiers",
    "packaging",
    "metadata",
    "cli",
    "custom-json-v1",
    "offline",
]

[metadata]
difficulty = "medium"
category = "static-data-library"
tags = [
    "python",
    "packaging",
    "classifiers",
    "metadata",
    "cli",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 35
canonical_manifest_digest = "sha256:ebf6ee6887ac5e390c39e0bc20e54b42fce0b158eb3d162ac7165679732585a7"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 420.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 8192

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
