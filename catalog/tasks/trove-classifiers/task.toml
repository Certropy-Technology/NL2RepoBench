schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/trove-classifiers"
version = "1.0.0"
description = "Build the frozen trove-classifiers package from an empty workspace and reproduce its typed classifier containers, deprecation mapping, packaging metadata, and equivalent module/console CLI through a separate offline verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "trove-classifiers",
    "packaging",
    "metadata",
    "cli",
    "custom-json-v1",
    "offline",
]

[metadata]
difficulty = "medium"
category = "static-data-library"
tags = [
    "python",
    "packaging",
    "classifiers",
    "metadata",
    "cli",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 35
canonical_manifest_digest = "sha256:7f2e86d787b7f0f1d220ff0f2cef01d729923540e3dab0850629e15921fa725f"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 420.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 8192

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
