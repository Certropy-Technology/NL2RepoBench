schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/starlette"
version = "1.0.0"
description = "Build the Starlette ASGI toolkit from an empty workspace and satisfy a deterministic local HTTP contract through a separate verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "asgi",
    "http",
    "routing",
    "responses",
    "middleware",
]

[metadata]
difficulty = "hard"
category = "asgi-web-framework"
tags = [
    "python",
    "asgi",
    "http",
    "routing",
    "responses",
    "middleware",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 24
canonical_manifest_digest = "sha256:a37e069d16609ccc5fe816685a4c35ff72472b204a7ea2def59cbafc1a42c626"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
