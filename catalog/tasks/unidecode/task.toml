schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/unidecode"
version = "1.0.0"
description = "Build Unidecode 1.4.0 from an empty workspace and satisfy a bounded transliteration, error-policy, lazy-cache, API, packaging, and CLI contract."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "unicode",
    "transliteration",
    "lazy-cache",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "text-transliteration"
tags = [
    "python",
    "unicode",
    "transliteration",
    "lazy-cache",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:2da040774accd04fcbe97aef2b7f68ae1f5400837480e5aefb10de301cce1db2"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
