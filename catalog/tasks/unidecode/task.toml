schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/unidecode"
version = "1.0.0"
description = "Build Unidecode 1.4.0 from an empty workspace and satisfy a bounded transliteration, error-policy, lazy-cache, API, packaging, and CLI contract."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "unicode",
    "transliteration",
    "lazy-cache",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "text-transliteration"
tags = [
    "python",
    "unicode",
    "transliteration",
    "lazy-cache",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:dbf1e52b9d89624bfdab7e26da4acde8c3be58950dfc343a3cd3281dd9420e1d"
toolchain_lock_digest = "sha256:f4effe9ffc4b8a0dc0762b3dfce2d575f03bcf4df7c2755c2157cd36b35eb4ff"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
