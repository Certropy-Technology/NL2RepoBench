difficulty = "hard"
category = "file-locking-and-concurrency"
tags = [
    "python",
    "file-locking",
    "fcntl",
    "multiprocessing",
    "atomic-write",
    "semaphores",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
