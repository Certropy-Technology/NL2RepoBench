schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/portalocker"
version = "1.0.0"
description = "Build portalocker from an empty workspace and reproduce deterministic POSIX file-locking, contention, lifecycle, atomic-write, PID-file, and bounded-semaphore behavior through a separate subprocess verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "file-locking",
    "fcntl",
    "multiprocessing",
    "atomic-write",
    "semaphores",
    "separate-verifier",
]

