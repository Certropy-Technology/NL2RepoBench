]

[task]
name = "nl2repobench/beartype"
version = "1.0.0"
description = "Build the pure-Python beartype 0.22.9 runtime type-checking library from an empty workspace, covering its decorator, DOOR predicates, validator factories, configuration, exception families, and typing compatibility exports."
