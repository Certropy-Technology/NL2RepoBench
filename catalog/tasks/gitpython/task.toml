schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/gitpython"
version = "0.1.0"
description = "Build GitPython from an empty workspace and implement a bounded local Git repository contract through a separate child-side JSON verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "git",
    "repository",
    "objects",
    "index",
    "diff",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "git-repository-library"
tags = [
    "python",
    "git",
    "repository",
    "objects",
    "index",
    "diff",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
