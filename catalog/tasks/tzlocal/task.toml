schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/tzlocal"
version = "1.0.0"
description = "Build tzlocal from an empty workspace and reproduce deterministic zone discovery, cache, reload, offset, and packaging behavior through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "datetime",
    "timezone",
    "zoneinfo",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "medium"
category = "time-zone-discovery"
tags = [
    "python",
    "datetime",
    "timezone",
    "zoneinfo",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:c781a6a44e535e3f517c251473923e096a53a417f296fde95eff80fb70d8ae16"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 480.0
