schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/tzlocal"
version = "1.0.0"
description = "Build tzlocal from an empty workspace and reproduce deterministic zone discovery, cache, reload, offset, and packaging behavior through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "datetime",
    "timezone",
    "zoneinfo",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "medium"
category = "time-zone-discovery"
tags = [
    "python",
    "datetime",
    "timezone",
    "zoneinfo",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:f5b5b4666664a5febfc07cf32cdf4207aaf9af304517f20f2ba421fb073d7a11"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 480.0
