schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/huggingface-hub"
version = "1.0.0"
description = "Build an offline-compatible huggingface_hub package from an empty workspace and satisfy a deterministic client-library contract for URL construction, headers, validation, data models, commit operations, local filtering, and filesystem helpers."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "huggingface",
    "http-client",
    "dataclasses",
    "offline",
]

[metadata]
difficulty = "hard"
category = "model-hub-client"
tags = [
    "python",
    "huggingface",
    "http-client",
    "dataclasses",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 40
canonical_manifest_digest = "sha256:5ea8fe6395fb9c433ef28d965252ec464960f6e24727c4c2830f9d303ab332b1"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 360.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
