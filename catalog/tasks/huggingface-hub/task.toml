schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/huggingface-hub"
version = "1.0.0"
description = "Build an offline-compatible huggingface_hub package from an empty workspace and satisfy a deterministic client-library contract for URL construction, headers, validation, data models, commit operations, local filtering, and filesystem helpers."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "huggingface",
    "http-client",
    "dataclasses",
    "offline",
]

[metadata]
difficulty = "hard"
category = "model-hub-client"
tags = [
    "python",
    "huggingface",
    "http-client",
    "dataclasses",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 40
canonical_manifest_digest = "sha256:f9cd89a7b5ff4662e4e303aa1268c2f242113010bde84b48f830177cb42ff0b1"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 360.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
