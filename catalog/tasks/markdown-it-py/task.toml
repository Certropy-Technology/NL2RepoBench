schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/markdown-it-py"
version = "0.1.0"
description = "Build markdown-it-py 4.2.0 from an empty workspace and satisfy a deterministic Markdown parsing, rendering, token, tree, ruler, URL, and CLI argument contract through a separate child adapter."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "markdown",
    "parser",
    "renderer",
    "tokens",
    "tree",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "markdown-parser"
tags = [
    "python",
    "markdown",
    "parser",
    "renderer",
    "tokens",
    "html",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
