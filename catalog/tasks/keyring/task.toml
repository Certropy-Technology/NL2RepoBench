schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/keyring"
version = "1.0.0"
description = "Build the frozen keyring credential-backend library from an empty workspace and reproduce its deterministic facade, backend, credential, configuration, plugin, CLI, and password-manager contracts through a separate offline verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "keyring",
    "credentials",
    "backends",
    "plugins",
    "cli",
    "offline",
    "repository-generation",
]

[metadata]
difficulty = "hard"
category = "credential-storage-library"
tags = [
    "python",
    "credentials",
    "backends",
    "cli",
    "plugins",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 45
canonical_manifest_digest = "sha256:6fea39d318e1afe6c4eac85becc429ba0bbdee0e8972ccc0c78caf77639720f4"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
