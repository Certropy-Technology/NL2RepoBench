schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/keyring"
version = "1.0.0"
description = "Build the frozen keyring credential-backend library from an empty workspace and reproduce its deterministic facade, backend, credential, configuration, plugin, CLI, and password-manager contracts through a separate offline verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "keyring",
    "credentials",
    "backends",
    "plugins",
    "cli",
    "offline",
    "repository-generation",
]

[metadata]
difficulty = "hard"
category = "credential-storage-library"
tags = [
    "python",
    "credentials",
    "backends",
    "cli",
    "plugins",
    "offline",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 45
canonical_manifest_digest = "sha256:c7b3f8393addcc450378aee6eb715e599906e54c1dea0b58ec04c54bac311a81"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
