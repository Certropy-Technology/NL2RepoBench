schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/uvicorn"
version = "1.0.0"
description = "Build Uvicorn 0.52.4 from an empty workspace and reproduce deterministic configuration, import, logging, proxy middleware, protocol-helper, WSGI-adaptation, flow-control, and server-state behavior through a separate verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "asgi",
    "http",
    "server",
    "middleware",
    "configuration",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
