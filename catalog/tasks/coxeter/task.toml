[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = ["skipped"]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
reason = "Exact source, archive, root and vendored license evidence, package/API inventory, geometry-test collection, numerical-determinism review, and SciPy dependency observations are recorded. Publication is blocked because no final image or hash-locked offline dependency closure exists, collection contains skipped/xfail and warning-policy decisions, floating-point and randomized geometry behavior is not cross-platform deterministic, packaging needs a license/data review, and no coxeter-specific child-side JSON/state adapter exists for the separate candidate subprocess boundary. No hidden tests, private bytes, Docker, Oracle, secrets, or shared catalog edits are authorized in this static lane."
