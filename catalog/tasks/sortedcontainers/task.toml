schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/sortedcontainers"
version = "0.2.0"
description = "Build sortedcontainers 2.4.0 from an empty workspace and satisfy a bounded sorted list, set, dictionary, and view scenario suite."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "sorted-list",
    "sorted-set",
    "sorted-dict",
    "stateful-api",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "data-structures"
tags = [
    "python",
    "sorted-containers",
    "sequences",
    "sets",
    "mappings",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:1b6fa208b6c8f99a75f1363482e278859aa8c6ba3c49c37758020e84fb3603b1"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 480.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
