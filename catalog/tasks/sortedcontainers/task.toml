schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/sortedcontainers"
version = "0.2.0"
description = "Build sortedcontainers 2.4.0 from an empty workspace and satisfy a bounded sorted list, set, dictionary, and view scenario suite."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "sorted-list",
    "sorted-set",
    "sorted-dict",
    "stateful-api",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "data-structures"
tags = [
    "python",
    "sorted-containers",
    "sequences",
    "sets",
    "mappings",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:da2819d5590d43be9d704d2a656caacfb33a8281f969efcc0e67190ef169f89d"
toolchain_lock_digest = "sha256:f4effe9ffc4b8a0dc0762b3dfce2d575f03bcf4df7c2755c2157cd36b35eb4ff"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 480.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
