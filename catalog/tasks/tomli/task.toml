schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/tomli"
version = "0.1.0"
description = "Build the pure-Python tomli TOML parser from an empty workspace and satisfy a deterministic JSON contract for parsing, types, files, and syntax errors."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "parser",
    "toml",
    "datetime",
    "errors",
    "separate-verifier",
]

[metadata]
difficulty = "medium"
category = "toml-parser"
tags = [
    "python",
    "parser",
    "toml",
    "datetime",
    "errors",
    "typed",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 32
canonical_manifest_digest = "sha256:2c861e018b1884b0987fa34c2fcefd98b651cc0f413e46dc19c5dd753f840648"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
