schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/autojump"
version = "0.1.0"
description = "Build the Autojump smart directory navigation utility from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "cli", "shell", "filesystem", "repository-generation", "separate-verifier"]

[metadata]
difficulty = "medium"
category = "python-cli"
tags = ["python", "cli", "shell", "filesystem", "separate-verifier"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 23

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
