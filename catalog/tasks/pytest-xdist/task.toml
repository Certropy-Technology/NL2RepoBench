schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pytest-xdist"
version = "1.0.0"
description = "Build pytest-xdist from an empty workspace and implement its deterministic pytest plugin, worker identity, fixture, hook, and distributed scheduling contract."
