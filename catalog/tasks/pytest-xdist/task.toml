    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "pytest",
    "distributed-testing",
    "subprocess",
    "fixtures",
    "scheduling",
]

[metadata]
difficulty = "hard"
category = "pytest-plugin"
tags = [
    "python",
    "pytest",
    "distributed-testing",
    "subprocess",
    "fixtures",
    "scheduling",
]
