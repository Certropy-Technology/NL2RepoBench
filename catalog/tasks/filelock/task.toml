schema_version = "1.0"
task_id = "filelock"
version = "0.1.0"
instruction = "instruction.md"

[metadata]
difficulty = "hard"
category = "filesystem-concurrency"
tags = ["python", "filesystem", "concurrency", "asyncio", "multiprocessing", "cross-platform", "repository-generation", "pytest"]
language = "python"

[source]
status = "known"
upstream_url = "https://github.com/tox-dev/filelock"
revision = "4aa742ca0992135fe21df290c8e9023f6981bb6f"
license_spdx = "MIT"
# Unprefixed `git archive --format=tar HEAD` from the detached 3.32.3 release.
source_digest = "sha256:1717a58d7ef0983c84bda07efb11fe46f98accaf4ab2581961f32d5e84f7b7f1"
submodules = []

# This is a public authoring audit, not a frozen verifier environment. The
# source probe used Linux/amd64 CPython 3.14.6; no immutable image is claimed.
[environment]
status = "unknown"
python_version = "3.14.6"
os_name = "linux/amd64"
network_mode = "no-network"

# filelock declares no runtime dependencies. These are the unpinned PEP 517
# build requirements and direct test requirements observed at the revision;
# they do not constitute an offline DependencyBundle.
[dependencies]
status = "unknown"
installer = "uv"
packages = [
  "hatch-vcs>=0.5",
  "hatchling>=1.29",
  "covdefaults>=2.3",
  "diff-cover>=10.2",
  "exceptiongroup>=1.2; python_version<'3.11'",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=3.16",
  "pytest-timeout>=2.4",
  "virtualenv>=21.2",
]

[tests]
framework = "pytest"
# CPython 3.10/3.12/3.13/3.14.6 source probes collected the same 1,306
# nodes. This is not a final verifier denominator until private assets and the
# immutable image are materialized.
expected_total = 1306
expected_total_source = "unknown"
commands = ["python -m pytest --continue-on-collection-errors -q tests"]
protected_paths = ["tests", "tasks"]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
# The upstream suite has capability-dependent skips and conditional xfails;
# the final verifier must freeze its policy before using this denominator.
excluded_statuses = ["skipped"]
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[lifecycle]
status = "blocked"
reason = "The exact 3.32.3 release source, MIT license, package LOC, stable multi-Python collection, Linux non-root source baseline, local filesystem contention probe, fallback probes, platform matrix, dependency declaration, and separate-verifier risks are recorded in audit.md. Publication is blocked because no immutable verifier image, hash-locked offline build/test dependency bundle, private test and command artifacts, Oracle bundle, or filelock-specific child-side adapter exists; cross-platform and network-filesystem behavior cannot be certified by the Linux source probe alone."
