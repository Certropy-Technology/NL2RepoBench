schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/python-fire"
version = "0.2.0"
description = "Build the pinned python-fire noninteractive CLI and help-text slice from an empty workspace."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "cli",
    "reflection",
    "help-text",
    "unicode",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "cli"
tags = [
    "python",
    "cli",
    "reflection",
    "help-text",
    "unicode",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:bc3455e37e31944251d66172a487b1a7d55cb2e2cc45a0581052928f6a5f93cc"
toolchain_lock_digest = "sha256:f4effe9ffc4b8a0dc0762b3dfce2d575f03bcf4df7c2755c2157cd36b35eb4ff"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
