schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/yoctocolors"
version = "1.0.0"
description = "Build the dependency-free yoctocolors 2.2.0 ESM package with deterministic ANSI styles, color detection, nesting, and TypeScript declarations."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "node",
    "npm",
    "esm",
    "terminal",
    "ansi",
    "colors",
    "formatting",
]

[metadata]
difficulty = "easy"
category = "terminal-styling"
tags = [
    "node",
    "npm",
    "esm",
    "terminal",
    "ansi",
    "colors",
    "formatting",
    "separate-verifier",
]
language = "node"
runtime = "node"
runtime_version = "24.19.0"
package_manager = "npm"
test_framework = "node:test"
metric_contract = "node-test-leaf-pass-rate-v1"
