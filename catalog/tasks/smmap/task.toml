schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/smmap"
version = "1.0.0"
description = "Build the frozen smmap memory-mapped buffer library from an empty workspace and satisfy deterministic local file, window, cursor, buffer, and resource-lifecycle contracts through a separate verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "mmap",
    "filesystem",
    "buffers",
    "resource-management",
]

[metadata]
difficulty = "medium"
category = "memory-mapped-buffer-library"
tags = [
    "python",
    "mmap",
    "filesystem",
    "buffers",
    "resource-management",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 16
canonical_manifest_digest = "sha256:fe35df4683f4b7619a674356e0a5eb1e187352d60057c60b54e1368844986b3e"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
