    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "mmap",
    "filesystem",
    "buffers",
    "resource-management",
]

[metadata]
difficulty = "medium"
category = "memory-mapped-buffer-library"
tags = [
    "python",
    "mmap",
    "filesystem",
    "buffers",
    "resource-management",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
