schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pyperf"
version = "2.10.0"
description = "Build the pyperf benchmarking library from an empty workspace with its Python API, JSON benchmark model, and command-line entry point."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "benchmark",
    "runner",
    "json",
    "cli",
]

[metadata]
difficulty = "medium"
category = "benchmarking-library"
tags = [
    "python",
    "benchmarking",
    "json",
    "cli",
    "repository-generation",
]
metric_contract = "fixed-test-pass-rate-v1"
