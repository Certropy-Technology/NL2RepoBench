schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/python-discovery"
version = "0.1.0"
description = "Build python-discovery from an empty workspace and implement deterministic interpreter metadata, version specification, cache, PATH, and discovery behavior."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "interpreter-discovery",
    "version-specifiers",
    "caching",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-tooling"
tags = [
    "python",
    "interpreter-discovery",
    "version-specifiers",
    "caching",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 32
canonical_manifest_digest = "sha256:fa64aa9670da8e7651e8aa63898df842264a776b2aee6098b560bc67111a2d77"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
