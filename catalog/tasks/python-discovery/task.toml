schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/python-discovery"
version = "0.1.0"
description = "Build python-discovery from an empty workspace and implement deterministic interpreter metadata, version specification, cache, PATH, and discovery behavior."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "interpreter-discovery",
    "version-specifiers",
    "caching",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-tooling"
tags = [
    "python",
    "interpreter-discovery",
    "version-specifiers",
    "caching",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 32
canonical_manifest_digest = "sha256:be5762970bcb71fae04d185516b23936b772ca30ad16c494dadbd3ee36a199b4"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
