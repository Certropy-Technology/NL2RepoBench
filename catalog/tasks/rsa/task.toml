schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/rsa"
version = "0.2.0"
description = "Build the pure-Python RSA implementation with PKCS#1 v1.5 encryption/signatures, key generation and serialization, integer primitives, and its command-line tools from an empty workspace."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "rsa",
    "cryptography",
    "pkcs1",
    "serialization",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "cryptography-library"
tags = [
    "python",
    "rsa",
    "cryptography",
    "pkcs1",
    "serialization",
    "cli",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 100
canonical_manifest_digest = "sha256:d42d0d822869714f35f057d4a760881aaf3d6574a0bddc0fa06565059082fe6d"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 900.0
