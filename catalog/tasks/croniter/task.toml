schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/croniter"
version = "1.0.0"
description = "Build the croniter cron iteration library from an empty workspace."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "cron",
    "datetime",
    "repository-generation",
    "separate-verifier",
]

[metadata]
difficulty = "medium"
category = "python-library"
tags = [
    "python",
    "cron",
    "datetime",
    "iteration",
    "repository-generation",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 15
canonical_manifest_digest = "sha256:1a6597543cd77989a53f0e3c0f002017245b30fe6f58cede345fb24c6e128bdf"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 2048
