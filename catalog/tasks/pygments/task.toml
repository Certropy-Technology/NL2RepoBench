schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pygments"
version = "0.1.0"
description = "Build the Pygments syntax-highlighting library from an empty workspace, including representative lexers, token types, formatters, lookup helpers, and the pygmentize CLI."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "syntax-highlighting",
    "lexers",
    "formatters",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "syntax-highlighting"
tags = [
    "python",
    "syntax-highlighting",
    "lexers",
    "formatters",
    "cli",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 32
canonical_manifest_digest = "sha256:0e2f9cbb0549cc0b6b6f04a776ee6b59a27d6a7e878d5e557dfaff0a609709a4"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
