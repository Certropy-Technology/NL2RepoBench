schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/virtualenv"
version = "1.0.0"
description = "Build the POSIX virtualenv 21.7.5 subset from an empty workspace and satisfy a bounded local environment-builder contract through a separate child verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "virtualenv",
    "cli",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-environment-builder"
tags = [
    "python",
    "virtualenv",
    "cli",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 36
canonical_manifest_digest = "sha256:e20966385a6adeeafc088f321e2238a115549fc82c39a03c7073dddd51c9c566"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
