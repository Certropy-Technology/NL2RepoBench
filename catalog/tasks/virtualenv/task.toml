schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/virtualenv"
version = "1.0.0"
description = "Build the POSIX virtualenv 21.7.5 subset from an empty workspace and satisfy a bounded local environment-builder contract through a separate child verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "virtualenv",
    "cli",
    "filesystem",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-environment-builder"
tags = [
    "python",
    "virtualenv",
    "cli",
    "filesystem",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 36
canonical_manifest_digest = "sha256:4e5417741d3c7c1c9328ea753173789fc0b5839ccdbe6424da84ff5879ef8f92"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
