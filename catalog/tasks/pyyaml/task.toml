schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pyyaml"
version = "1.0.0"
description = "Build PyYAML from an empty workspace and satisfy the deterministic YAML parsing, serialization, event, node, merge, extension, and error contract through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "yaml",
    "parser",
    "serializer",
    "safe-loader",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "serialization-library"
tags = [
    "python",
    "yaml",
    "parser",
    "serializer",
    "safe-loader",
    "events",
    "nodes",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 64
canonical_manifest_digest = "sha256:b3f96fe7d1136e7e95f534d5353c2563a48b8bce0298183f37962ae9c61f893d"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
