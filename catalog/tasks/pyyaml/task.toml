schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pyyaml"
version = "1.0.0"
description = "Build PyYAML from an empty workspace and satisfy the deterministic YAML parsing, serialization, event, node, merge, extension, and error contract through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "yaml",
    "parser",
    "serializer",
    "safe-loader",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "serialization-library"
tags = [
    "python",
    "yaml",
    "parser",
    "serializer",
    "safe-loader",
    "events",
    "nodes",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 64
canonical_manifest_digest = "sha256:a98acb37092e1a0e9387d9609c746a865abef83ba9ae2c7dbf265fa227a877be"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
