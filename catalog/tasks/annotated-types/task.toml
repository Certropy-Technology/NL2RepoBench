]

[task]
name = "nl2repobench/annotated-types"
version = "0.1.0"
description = "Build the annotated-types typing metadata library from an empty workspace; grading uses isolated deterministic checks for metadata classes, grouped constraints, predicate aliases, and documentation metadata."
