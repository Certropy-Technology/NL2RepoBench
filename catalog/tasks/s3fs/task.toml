schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/s3fs"
version = "1.0.0"
description = "Build s3fs from an empty workspace and satisfy a deterministic fake-client filesystem contract through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "s3",
    "fsspec",
    "asyncio",
    "fake-client",
    "filesystem",
]

[metadata]
difficulty = "hard"
category = "filesystem-adapter"
tags = [
    "python",
    "s3",
    "fsspec",
    "asyncio",
    "filesystem",
    "fake-client",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:65906463abaf6c58fb96e91679cfe727d68966ad87228b7f630ebad7f9d96a29"
toolchain_lock_digest = "sha256:e54be279a86caa843480b583d388ff7e6c977605b505448ba54549621be5ed68"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
