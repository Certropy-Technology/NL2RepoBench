schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/s3fs"
version = "1.0.0"
description = "Build s3fs from an empty workspace and satisfy a deterministic fake-client filesystem contract through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "s3",
    "fsspec",
    "asyncio",
    "fake-client",
    "filesystem",
]

[metadata]
difficulty = "hard"
category = "filesystem-adapter"
tags = [
    "python",
    "s3",
    "fsspec",
    "asyncio",
    "filesystem",
    "fake-client",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:888371ea37fbf34036141ff64b1f3d50c4a5c3839a0930f370f00f66850ba241"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
