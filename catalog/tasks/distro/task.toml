schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/distro"
version = "0.1.0"
description = "Build the pinned distro Linux distribution information library from an empty workspace and satisfy deterministic os-release, release-file, accessor, and CLI scenarios."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "linux",
    "os-release",
    "cli",
    "scenario-adapter",
    "parsing",
]

[metadata]
difficulty = "medium"
category = "system-information"
tags = [
    "python",
    "linux",
    "os-release",
    "cli",
    "parsing",
    "scenario-adapter",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 15
canonical_manifest_digest = "sha256:dab9e308ebb402c8c10324b5e66b375a6c665a694689ea86f30c9a2c2e6ab436"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
