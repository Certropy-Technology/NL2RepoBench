schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/dnspython"
version = "0.1.0"
description = "Build dnspython from an empty workspace and reproduce deterministic DNS name, RR, zone-file, wire-format, and message-construction behavior through a separate child-side verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "dns",
    "wire-format",
    "zone-files",
    "message-building",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "dns-toolkit"
tags = [
    "python",
    "dns",
    "wire-format",
    "zone-files",
    "message-building",
    "parsing",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:566277b31374f5995354e318d888b7e6f565a9145c7ae423a411e1d54e27a043"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
