schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/opentelemetry-semantic-conventions"
version = "1.0.0"
description = "Build the OpenTelemetry semantic conventions package from an empty workspace and satisfy a deterministic subset of generated attributes, metrics, schemas, and version contracts through a separate child-process verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "opentelemetry",
    "semantic-conventions",
    "generated-constants",
    "enum",
    "separate-verifier",
]

[metadata]
difficulty = "medium"
category = "python-constants-library"
tags = [
    "python",
    "opentelemetry",
    "semantic-conventions",
    "generated-constants",
    "enum",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 18
canonical_manifest_digest = "sha256:f2db52e4ca605723572cfe4cf863bc00a4438a27f6014a86327eac1f892dd607"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
