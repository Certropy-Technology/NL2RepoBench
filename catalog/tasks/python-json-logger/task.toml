]

[task]
name = "nl2repobench/python-json-logger"
version = "1.0.0"
description = "Build python-json-logger from an empty workspace and reproduce deterministic JSON logging formatter, field selection, exception serialization, and compatibility behavior through a separate child-process verifier."
