schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/graphneuralnetwork"
version = "0.1.0"
description = "Build the GraphNeuralNetwork TensorFlow graph-learning package from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "tensorflow", "graph-neural-network", "machine-learning", "repository-generation", "separate-verifier"]

[metadata]
difficulty = "easy"
category = "python-library"
tags = ["python", "tensorflow", "graph-neural-network", "machine-learning", "separate-verifier"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 4

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 32768

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 32768
