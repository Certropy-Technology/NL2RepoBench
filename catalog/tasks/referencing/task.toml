schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/referencing"
version = "0.1.0"
description = "Build the pinned referencing JSON reference resolver from an empty workspace with immutable registries, specification-aware resources, JSON Pointer and anchor lookup, JSON Schema dialect support, and deterministic retrieval helpers."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "json",
    "json-schema",
    "resolver",
    "registry",
    "anchors",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-library"
tags = [
    "python",
    "json",
    "json-reference",
    "json-schema",
    "registry",
    "resolver",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
