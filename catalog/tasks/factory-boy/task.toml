schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/factory-boy"
version = "1.0.0"
description = "Build factory-boy 3.3.4.dev0 from an empty workspace and satisfy a deterministic child-side contract for declarative factories, nested declarations, strategies, Faker, fuzzy values, random state, and core utilities."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "factories",
    "declarations",
    "faker",
    "fuzzy-values",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "test-fixture-library"
tags = [
    "python",
    "factories",
    "declarations",
    "faker",
    "fuzzy-values",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:efec0151f2cae6523442ed07849cedb51324fdb9176673af52842c18e9eb292a"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
