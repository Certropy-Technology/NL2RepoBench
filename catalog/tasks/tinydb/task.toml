schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/tinydb"
version = "1.0.0"
description = "Build TinyDB 4.9.0 from an empty workspace and satisfy a bounded storage, query, table, update, middleware, and cache contract."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "document-database",
    "json-storage",
    "query-builder",
    "middleware",
    "separate-verifier",
]

