difficulty = "medium"
category = "embedded-document-database"
tags = [
    "python",
    "document-database",
    "json-storage",
    "queries",
    "middleware",
    "lru-cache",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
