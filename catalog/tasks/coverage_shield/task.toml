schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "nl2repobench/coverage_shield"
version = "0.1.0"
description = "Build the coverage_shield Python coverage-badge tool from an empty workspace."
authors = [{ name = "NL2RepoBench" }]
keywords = ["python", "coverage", "repository-generation", "cli", "separate-verifier"]

[metadata]
difficulty = "easy"
category = "developer-tool"
tags = ["python", "coverage", "cli", "git"]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 11

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 8192

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
