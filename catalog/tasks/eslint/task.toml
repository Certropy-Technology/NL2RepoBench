schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/eslint"
version = "2.0.0"
description = "Production Node task for rebuilding a deterministic ESLint 10.9.0 linting, autofix, source-code, and flat-config API slice."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "node",
    "npm",
    "eslint",
    "linter",
    "static-analysis",
    "autofix",
    "source-code",
    "config",
]

[metadata]
difficulty = "hard"
category = "javascript-linter"
tags = [
    "node",
    "npm",
    "eslint",
    "linter",
    "static-analysis",
    "autofix",
    "source-code",
    "config",
]
language = "node"
runtime = "node"
runtime_version = "24.19.0"
package_manager = "npm"
test_framework = "node:test"
metric_contract = "node-test-leaf-pass-rate-v1"
