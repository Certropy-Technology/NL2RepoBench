schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/eslint"
version = "2.0.0"
description = "Production Node task for rebuilding a deterministic ESLint 10.9.0 linting, autofix, source-code, and flat-config API slice."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "node",
    "npm",
    "eslint",
    "linter",
    "static-analysis",
    "autofix",
    "source-code",
    "config",
]

[metadata]
difficulty = "hard"
category = "javascript-linter"
tags = [
    "node",
    "npm",
    "eslint",
    "linter",
    "static-analysis",
    "autofix",
    "source-code",
    "config",
]
language = "node"
runtime = "node"
runtime_version = "24.19.0"
package_manager = "npm"
test_framework = "node:test"
metric_contract = "node-test-leaf-pass-rate-v1"
expected_test_count = 20
canonical_manifest_digest = "sha256:c51b566571a6c1e4ba0504025c275a692c4fa051e0783eb7d67b757fc5e694e4"
toolchain_lock_digest = "sha256:4a70f5734f00f1822b9f3aa9755ebdbed19848407d57f537cc97290608ec5b2f"

[agent]
timeout_sec = 1500.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
