schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/pytest"
version = "1.0.0"
description = "Build the pinned pytest testing framework from an empty workspace and reproduce a bounded deterministic public contract for assertions, approximate comparisons, fixtures, markers, outcomes, monkeypatching, CLI execution, and test collection through a separate subprocess verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "testing",
    "fixtures",
    "markers",
    "assertions",
    "cli",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "python-test-framework"
tags = [
    "python",
    "testing",
    "fixtures",
    "markers",
    "assertions",
    "cli",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 28
canonical_manifest_digest = "sha256:9c646b15faf5e0e2eaa26c2fce8b01a54971a47ae982a87bc7c25e2bccc27873"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 16384

[environment]
network_mode = "no-network"
