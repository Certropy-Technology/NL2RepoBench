schema_version = "1.4"
artifacts = [
    "/workspace",
]

[task]
name = "nl2repobench/fastapi"
version = "1.0.0"
description = "Build FastAPI 0.141.1 from an empty workspace and reproduce deterministic parameter, encoding, routing, OpenAPI, security, SSE, response, and middleware behavior through an isolated subprocess verifier."
authors = [
    { name = "NL2RepoBench" },
]
keywords = [
    "python",
    "asgi",
    "openapi",
    "validation",
    "security",
    "separate-verifier",
]

[metadata]
difficulty = "hard"
category = "asgi-web-framework"
tags = [
    "python",
    "asgi",
    "openapi",
    "validation",
    "security",
    "separate-verifier",
]
metric_contract = "fixed-test-pass-rate-v1"
expected_test_count = 30
canonical_manifest_digest = "sha256:9e644263911d070c42490cb11da6ba20f99c7c7314b7d1874e47d86110e10fe6"
toolchain_lock_digest = "sha256:230a7dd32d1de931a868d75901ea4f340882cf1aad24e61ee7918543075ab366"

[agent]
