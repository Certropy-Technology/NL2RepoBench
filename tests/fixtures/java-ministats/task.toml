schema_version = "1.0"
task_id = "java-ministats"
version = "0.1.0"
instruction = "instruction.md"

[metadata]
difficulty = "easy"
category = "java-library"
tags = ["java", "maven", "typed-runtime"]
language = "java"

[source]
status = "unknown"

[environment]
status = "unknown"
os_name = "debian-bookworm"
network_mode = "no-network"

[environment.runtime]
language = "java"
runtime = "jdk"
version = "temurin-21.0.12+8"
package_manager = "maven"
package_manager_version = "3.9.11"
architecture = "linux/amd64"
libc = "glibc"

[environment.network_policy]
mode = "no-network"
offline_dependencies = "preinstalled-image"
reference_source_fetch = "forbidden"
reason = "The synthetic Java verifier has no third-party dependency closure."

[dependencies]
status = "unknown"
package_manager = "maven"
packages = []

[tests]
framework = "junit-platform"
report_format = "junit-open-test-report-xml-v1"
expected_total = 3
expected_total_source = "frozen-collection"
commands = ["mvn --offline validate", "javac verifier-owned contract"]

[metric]
contract_id = "fixed-test-pass-rate-v1"
passed_statuses = ["passed"]
excluded_statuses = []
collection_mismatch = "fail"
formula = "clamp(passed / frozen_total, 0, 1)"

[harbor]
description = "Build a small Java library from an empty workspace with Maven and a separate verifier."
keywords = ["java", "maven", "junit", "offline"]
agent_timeout_sec = 600.0
verifier_timeout_sec = 600.0
candidate_install_timeout_sec = 90.0
candidate_total_timeout_sec = 300.0
agent_network_mode = "no-network"
verifier_network_mode = "no-network"
cpus = 1
memory_mb = 1024
storage_mb = 4096
workspace_artifact = "/workspace"

[lifecycle]
status = "discovered"
reason = "Development-only Java/Maven vertical slice."
